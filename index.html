<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4eddb">
  <title>Big Pickle</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #243d1e;
      --paper: #f4eddb;
      --green: #43852f;
      --lime: #a6c84a;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100svh;
      margin: 0;
      overflow-x: hidden;
      background: var(--paper);
      color: var(--ink);
      font-family: ui-rounded, "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
    }
    main {
      min-height: 100svh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: clamp(22px, 4vw, 56px) clamp(24px, 7vw, 100px) 24px;
      isolation: isolate;
    }
    header, footer { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .brand, .edition { font-size: 12px; font-weight: 800; letter-spacing: .15em; text-transform: uppercase; }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand span { font-size: 21px; }
    .edition { opacity: .6; }
    .stage {
      min-height: 570px;
      position: relative;
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: center;
      max-width: 1300px;
      width: 100%;
      margin: 0 auto;
    }
    .copy { position: relative; z-index: 2; padding: 40px 0; }
    .eyebrow { margin: 0 0 18px; color: #648139; font-size: 12px; font-weight: 800; letter-spacing: .2em; text-transform: uppercase; }
    h1 { max-width: 580px; margin: 0; font-size: clamp(72px, 11vw, 156px); line-height: .78; letter-spacing: -.095em; }
    h1 span { display: block; color: var(--green); }
    .description { max-width: 340px; margin: 30px 0 0; color: #53624a; font-size: clamp(15px, 1.5vw, 18px); line-height: 1.55; }
    .pickle-wrap { position: relative; display: grid; place-items: center; min-width: 0; height: 100%; }
    .pickle { width: min(44vw, 470px); min-width: 280px; overflow: visible; transform: rotate(13deg); filter: drop-shadow(24px 32px 18px #35482724); animation: bob 5s ease-in-out infinite; }
    .orbit { position: absolute; width: min(43vw, 490px); aspect-ratio: 1; border: 1px solid #78935345; border-radius: 50%; transform: rotate(-24deg) scaleY(.3); }
    .orbit::before, .orbit::after { content: ""; position: absolute; border-radius: 50%; background: #789353; }
    .orbit::before { width: 9px; height: 9px; top: 15%; left: 10%; }
    .orbit::after { width: 6px; height: 6px; bottom: 13%; right: 7%; }
    .spark { position: absolute; color: #84a33f; font-size: 28px; }
    .spark.one { top: 22%; right: 8%; }
    .spark.two { bottom: 22%; left: 8%; font-size: 19px; }
    footer { padding-top: 18px; border-top: 1px solid #243d1e2e; color: #647255; font-size: 11px; font-weight: 700; letter-spacing: .13em; text-transform: uppercase; }
    footer span:last-child { text-align: right; }
    @keyframes bob { 0%, 100% { translate: 0 0; } 50% { translate: 0 -13px; } }
    @media (max-width: 700px) {
      main { padding-inline: 24px; }
      .stage { min-height: auto; grid-template-columns: 1fr; grid-template-rows: auto minmax(330px, 48vh); padding-top: 48px; }
      .copy { padding: 0; }
      h1 { font-size: clamp(76px, 19vw, 130px); }
      .description { max-width: 290px; margin-top: 20px; }
      .pickle { width: min(66vw, 360px); min-width: 0; }
      .orbit { width: min(67vw, 390px); }
      .edition { text-align: right; }
    }
    @media (prefers-reduced-motion: reduce) { .pickle { animation: none; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="brand"><span aria-hidden="true">🥒</span> Big Pickle Co.</div>
      <div class="edition">A very large idea · Est. today</div>
    </header>
    <section class="stage" aria-labelledby="title">
      <div class="copy">
        <p class="eyebrow">Small jar energy</p>
        <h1 id="title">BIG <span>PICKLE</span></h1>
        <p class="description">One gloriously oversized pickle. Crisp attitude, extra crunch, absolutely no chill.</p>
      </div>
      <div class="pickle-wrap" aria-label="An enormous, bright green pickle">
        <div class="orbit" aria-hidden="true"></div>
        <span class="spark one" aria-hidden="true">✳</span>
        <span class="spark two" aria-hidden="true">✳</span>
        <svg class="pickle" viewBox="0 0 360 700" role="img" aria-labelledby="pickle-title">
          <title id="pickle-title">A big bumpy pickle</title>
          <defs>
            <linearGradient id="skin" x1="0" y1="0" x2="1" y2=".3">
              <stop offset="0" stop-color="#2f702b"/>
              <stop offset=".2" stop-color="#75a936"/>
              <stop offset=".48" stop-color="#a7c94c"/>
              <stop offset=".72" stop-color="#78aa37"/>
              <stop offset="1" stop-color="#386e2b"/>
            </linearGradient>
            <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
              <stop stop-color="#fff" stop-opacity=".36"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
            </linearGradient>
            <clipPath id="pickle-shape"><path d="M177 38C114 31 72 83 71 163c-1 77 25 132 16 214-9 83-43 172-10 234 24 46 72 53 113 40 48-15 82-60 76-119-8-75-36-134-25-215 11-78 43-139 18-212-14-42-42-64-82-67Z"/></clipPath>
          </defs>
          <path d="M177 38C114 31 72 83 71 163c-1 77 25 132 16 214-9 83-43 172-10 234 24 46 72 53 113 40 48-15 82-60 76-119-8-75-36-134-25-215 11-78 43-139 18-212-14-42-42-64-82-67Z" fill="url(#skin)" stroke="#315f26" stroke-width="7"/>
          <g clip-path="url(#pickle-shape)" fill="none" stroke-linecap="round">
            <path d="M107 85c-19 55-12 104 1 146m-20 45c13 39 13 88 2 131m-10 58c-4 39 1 72 14 98" stroke="url(#shine)" stroke-width="15"/>
            <path d="M179 38c-5 18 1 29 18 34 16 6 22-2 27-15" stroke="#704a22" stroke-width="14"/>
            <path d="M184 41c-2-13 3-23 14-30" stroke="#50772e" stroke-width="9"/>
            <g fill="#d7dc78" stroke="#5e8b32" stroke-width="3">
              <ellipse cx="143" cy="101" rx="8" ry="13"/><ellipse cx="204" cy="113" rx="7" ry="11"/>
              <ellipse cx="112" cy="156" rx="7" ry="12"/><ellipse cx="168" cy="174" rx="8" ry="13"/><ellipse cx="225" cy="163" rx="7" ry="11"/>
              <ellipse cx="133" cy="226" rx="8" ry="12"/><ellipse cx="197" cy="245" rx="7" ry="12"/><ellipse cx="90" cy="290" rx="7" ry="11"/>
              <ellipse cx="151" cy="310" rx="8" ry="13"/><ellipse cx="219" cy="329" rx="7" ry="12"/><ellipse cx="111" cy="373" rx="7" ry="11"/>
              <ellipse cx="174" cy="398" rx="8" ry="13"/><ellipse cx="231" cy="428" rx="7" ry="11"/><ellipse cx="125" cy="454" rx="8" ry="12"/>
              <ellipse cx="190" cy="485" rx="7" ry="12"/><ellipse cx="99" cy="526" rx="7" ry="11"/><ellipse cx="151" cy="557" rx="8" ry="13"/>
              <ellipse cx="212" cy="575" rx="7" ry="11"/><ellipse cx="126" cy="620" rx="7" ry="10"/>
            </g>
          </g>
        </svg>
      </div>
    </section>
    <footer><span>Extra large. Extra crunchy.</span><span>100% pickle attitude</span></footer>
  </main>
</body>
</html>
